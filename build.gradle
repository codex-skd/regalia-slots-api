plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

repositories {
    mavenLocal()
    maven {
        name = "CurseMaven"
        url = uri("https://www.cursemaven.com")
    }
    maven {
        name = "JEI"
        url = uri("https://maven.blamejared.com/")
    }
    maven {
        name = "EMI"
        url = uri("https://maven.terraformersmc.com/")
    }
    maven {
        name = "REI"
        url = uri("https://maven.shedaniel.me/")
    }
}

base {
    archivesName = "${mod_id}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

neoForge {
    version = project.neoforge_version
    addModdingDependenciesTo sourceSets.test
//    validateAccessTransformers = true
    accessTransformers.from "src/main/resources/META-INF/accesstransformer.cfg"

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        clientData {
            clientData()
            programArguments.addAll '--mod', "regalia_slots_api_test", '--all', '--output', file('src/generated/test/resources/').getAbsolutePath(), '--existing', file('src/test/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }

        "regalia_slots_api_test" {
            sourceSet sourceSets.test
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/main/resources' }
sourceSets.test.resources { srcDir 'src/generated/test/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

tasks.register('apiJar', Jar) {
    archiveClassifier.set('api')
    include 'com/skd/regaliaslotsapi/api/**/*'
    from sourceSets.main.allSource
    from sourceSets.main.output
}

test {
    failOnNoDiscoveredTests = false
}

sourcesJar {
    from(rootProject.file("LICENSE"))
    from(rootProject.file("COPYING"))
    from(rootProject.file("COPYING.LESSER"))
    from(rootProject.file("README.md"))
    from(rootProject.file("CHANGELOG.md"))
}

jar {
    from(rootProject.file("LICENSE"))
    from(rootProject.file("COPYING"))
    from(rootProject.file("COPYING.LESSER"))
    from(rootProject.file("README.md"))
    from(rootProject.file("CHANGELOG.md"))
}

artifacts {
    archives apiJar
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-26.2-neoforge:${jei_version}"

//    compileOnly "dev.emi:emi-neoforge:${emi_version}"
//    localRuntime "dev.emi:emi-neoforge:${emi_version}"

//    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
//    compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:${rei_version}"
//    localRuntime "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
            neoforge_version_range : neoforge_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            license                : license,
            issues_url             : issues_url,
            version                : version,
            mod_author             : mod_author,
            mod_description        : mod_description,
            sources_url            : sources_url
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishing {

    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            artifact jar
            artifact apiJar
            artifact sourcesJar
        }
    }

    repositories {
        maven {
            url = "${System.getenv('MAVEN_URL')}"
            credentials {
                username = "${System.getenv('MAVEN_USER')}"
                password = "${System.getenv('MAVEN_PASSWORD')}"
            }
        }
    }
}
